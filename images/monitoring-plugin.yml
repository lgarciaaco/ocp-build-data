cachito:
  enabled: true
  packages:
    npm:
    - path: web
    gomod:
    - path: .
content:
  source:
    dockerfile: Dockerfile.art
    git:
      branch:
        target: release-{MAJOR}.{MINOR}
      url: git@github.com:openshift-priv/monitoring-plugin.git
      web: https://github.com/openshift/monitoring-plugin
    ci_alignment:
      streams_prs:
        ci_build_root:
          member: ci-openshift-build-root-latest.rhel9
    pkg_managers:
    - npm
    - gomod
    okd_alignment:
      dockerfile: Dockerfile
distgit:
  branch: rhaos-{MAJOR}.{MINOR}-rhel-9
  component: monitoring-plugin-container
delivery:
  # Maps to honeybadger repo_name
  repo_name: ose-monitoring-plugin
  delivery_repo_names:
  - openshift5/ose-monitoring-plugin-rhel9
for_payload: true
from:
  builder:
  - member: openshift-base-nodejs.rhel9
  - stream: rhel-9-golang
  member: openshift-enterprise-base-rhel9
name: openshift/ose-monitoring-plugin-rhel9
payload_name: monitoring-plugin
owners:
- team-observability-ui@redhat.com
konflux:
  cachito:
    mode: emulation
okd:
  content:
    source:
      modifications:
      - action: replace
        match: RUN make install-frontend-ci && make build-frontend
        replacement: |
          ENV NPM_CONFIG_FETCH_TIMEOUT=600000 NPM_CONFIG_FETCH_RETRIES=5 NPM_CONFIG_FETCH_RETRY_MINTIMEOUT=20000 NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT=120000 NPM_CONFIG_MAXSOCKETS=3
          RUN make install-frontend-ci && make build-frontend
